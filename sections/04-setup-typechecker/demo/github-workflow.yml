# .github/workflows/pyrefly.yml
#
# Runs pyrefly on every push and every pull request.
name: pyrefly

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]     # or however you install deps in your project

      - name: Run pyrefly
        run: pyrefly check
