# Reference: what a real-world pyrefly config looks like once you've done
# the intermediate exercise. This shows the `[tool.pyrefly]` form (embedded
# in pyproject.toml). The equivalent standalone `pyrefly.toml` just drops
# the `tool.pyrefly.` prefix from every key.
#
# Paste the whole [tool.pyrefly] block into your own project's pyproject.toml
# and adjust project-includes / paths to match your source layout.

[tool.pyrefly]
python-version = "3.12"

# Only check code we own, not tests or build artifacts.
project-includes = ["src/**/*.py"]
project-excludes = [
    "**/tests/**",
    "**/build/**",
    "**/.venv/**",
]

# Per-module severity overrides. Great for rolling out to legacy code —
# leave the errors visible (as warnings) but don't fail CI on them.
# Once the module is clean, remove the corresponding [[sub-config]] block.

[[tool.pyrefly.sub-config]]
matches = "**/legacy.py"

[tool.pyrefly.sub-config.errors]
missing-attribute = "warn"
unsupported-operation = "warn"
bad-return = "warn"
