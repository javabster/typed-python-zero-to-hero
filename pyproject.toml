[project]
name = "pyconau26-typing-workshop"
version = "0.1.0"
description = "Typed Python: from Zero to Hero — PyCon AU 2026 tutorial materials"
requires-python = ">=3.10"
dependencies = [
    "pyrefly",
    "numpy",
    "pytest",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The exercise folders aren't a package — this project is just a container for materials.
py-modules = []

# Workshop-wide pyrefly config for the exercises under sections/.
#
# example-project/ is EXCLUDED here on purpose — Section 4 walks through
# adding a fresh [tool.pyrefly] block to example-project/pyproject.toml.
# If we included it here, our root config would win over the local one and
# the "cold start" demo wouldn't work.
[tool.pyrefly]
project-includes = ["sections/**/*.py"]
project-excludes = ["example-project/**", "**/.venv/**"]
python-version = "3.12"
