[project]
name = "example-project"
version = "0.1.0"
description = "Toy untyped URL shortener used in Section 4 exercises"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pyrefly"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Bare-bones Pyrefly config. Section 4 exercises walk through growing it —
# adding project-includes/excludes and per-module severity overrides.
# See ../sections/04-setup-typechecker/exercises/02-intermediate/README.md.
[tool.pyrefly]
python-version = "3.12"
